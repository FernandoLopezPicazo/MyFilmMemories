<div class="container">
  <h1>🗓️ Horario</h1>
  <p class="subtitulo">Lo que tienes marcado "en emisión", mezclando series, películas y mangas.</p>

  <div class="error" *ngIf="error">{{ error }}</div>
  <div class="hint" *ngIf="cargando">Cargando...</div>

  <div class="semana" *ngIf="!cargando">
    <div class="dia-columna" *ngFor="let dia of dias" [class.dia-hoy]="dia.esHoy">
      <div class="dia-cabecera">{{ dia.etiqueta }}</div>
      <div class="dia-items" *ngIf="dia.items.length > 0">
        <div class="item-horario" *ngFor="let item of dia.items">
          <img *ngIf="item.imagenUrl" [src]="item.imagenUrl" [alt]="item.titulo" class="item-imagen" />
          <div *ngIf="!item.imagenUrl" class="item-imagen-ph">{{ ICONO_TIPO[item.tipo] }}</div>
          <div class="item-info">
            <span class="item-titulo">{{ ICONO_TIPO[item.tipo] }} {{ item.titulo }}</span>
            <span class="item-frecuencia" *ngIf="item.frecuencia === 'MENSUAL'">Mensual · semana {{ item.semanaDelMes }}</span>
          </div>
        </div>
      </div>
      <div class="dia-vacio" *ngIf="dia.items.length === 0">Nada este día</div>
    </div>
  </div>
</div>
