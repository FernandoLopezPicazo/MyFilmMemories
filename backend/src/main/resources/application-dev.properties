# Perfil de desarrollo local / instalador Electron: H2 en fichero, sin
# autenticación (ver SecurityConfigDev). Igual que la configuración de
# siempre, sin ningún cambio de comportamiento para el instalador de escritorio.

spring.datasource.url=jdbc:h2:file:./data/seriesdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true

# Flyway no se usa en H2 local — el esquema lo sigue gestionando ddl-auto=update
spring.flyway.enabled=false

# Con Flyway en el classpath, Spring Boot desactiva por defecto la ejecución
# automática de schema.sql (asume que el esquema lo gestiona Flyway). Aquí sí
# lo necesitamos: el backfill de usuario_id de schema.sql debe ejecutarse
# siempre en local antes de que Hibernate intente su propio ALTER.
spring.sql.init.mode=always
