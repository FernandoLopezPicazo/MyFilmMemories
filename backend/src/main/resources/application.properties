# Perfil activo por defecto: "dev" (H2 local, usado por el instalador Electron
# y por desarrollo). En Render se sobreescribe con SPRING_PROFILES_ACTIVE=prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Tamaño máximo de fichero subido (por defecto es 1MB, lo subimos a 10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Render inyecta su propio puerto vía la variable PORT; en local usamos 8090.
server.port=${PORT:8090}

# CORS: orígenes permitidos, coma-separados. En Render se sobreescribe con
# APP_CORS_ALLOWED_ORIGINS apuntando al dominio real de Vercel/Netlify.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
