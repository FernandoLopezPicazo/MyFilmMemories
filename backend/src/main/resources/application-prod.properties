# Perfil de nube: Postgres de Supabase + validación JWT de Supabase Auth +
# Supabase Storage. Todas las variables de entorno se configuran en Render.

# Usar el "Session pooler" de Supabase (puerto 6543 con modo sesión, no el
# "Transaction pooler"): Hibernate usa prepared statements server-side, que
# el Transaction pooler de PgBouncer rompe con errores crípticos tipo
# "prepared statement already exists".
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# El plan gratuito de Supabase limita las conexiones concurrentes — un pool
# pequeño evita agotarlas si Render reinicia/escala el contenedor.
spring.datasource.hikari.maximum-pool-size=5

# El esquema lo gestiona Flyway (db/migration/V1__*.sql) — Hibernate solo
# valida que las entidades coinciden con lo que Flyway ya creó, nunca lo
# modifica automáticamente.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

# Validación de JWT de Supabase Auth (Resource Server) — ver SecurityConfig
app.supabase.jwks-uri=${SUPABASE_JWKS_URI}
app.supabase.issuer=${SUPABASE_JWT_ISSUER}

# Supabase Storage (imágenes) — ver ImagenController/SupabaseStorageClient
app.supabase.project-url=${SUPABASE_PROJECT_URL}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
app.supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:imagenes}
